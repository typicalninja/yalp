name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; the version
      # bundled with setup-node's Node 22 may be older.
      - run: npm install -g npm@latest

      # Bump package.json's version and push to main to release. No-op on
      # any push that doesn't introduce a new version, so this is safe to
      # let run on every push. Requires a Trusted Publisher for this exact
      # repo + workflow file configured on the yalp package's settings on
      # npmjs.com.
      - name: Check if this version is already published
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "yalp@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance
